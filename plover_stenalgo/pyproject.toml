[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plover-stenalgo"
version = "0.2.0"
description = "Plover system plugin for Stenalgo's French Starboard steno theory"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."plover.system"]
"Stenalgo French" = "plover_stenalgo.system"

[project.entry-points."plover.dictionary"]
stenalgo = "plover_stenalgo.dictionary:StenalgoExpressionDictionary"

[tool.setuptools.packages.find]
include = ["plover_stenalgo*"]

[tool.setuptools.package-data]
plover_stenalgo = ["dictionaries/*"]
