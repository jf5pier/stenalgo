name: Deploy steno-trainer to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["steno-trainer/**", ".github/workflows/deploy-steno-trainer.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Elm
        run: npm install -g elm
      - name: Compile
        working-directory: steno-trainer
        run: elm make src/Main.elm --output=main.js --optimize
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: steno-trainer
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
